<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">工作台页面信息架构</title>
  <desc id="desc">展示工作台、控制台、历史、产物、设置四个导航入口及其核心页面模块。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#667085"/></marker>
    <style>
      .bg{fill:#f7f8fa}.title{font:700 30px "Microsoft YaHei","PingFang SC",sans-serif;fill:#101828}.subtitle{font:400 16px "Microsoft YaHei","PingFang SC",sans-serif;fill:#667085}.panel{fill:#fff;stroke:#d0d5dd;stroke-width:2}.root{fill:#344054;stroke:#344054;stroke-width:2}.nav{fill:#eef4ff;stroke:#84adf7;stroke-width:2}.detail{fill:#fff;stroke:#98a2b3;stroke-width:2}.accent{fill:#f5f3ff;stroke:#b692f6;stroke-width:2}.roottext{font:700 20px "Microsoft YaHei","PingFang SC",sans-serif;fill:#fff}.head{font:700 18px "Microsoft YaHei","PingFang SC",sans-serif;fill:#101828}.sub{font:400 13px "Microsoft YaHei","PingFang SC",sans-serif;fill:#667085}.label{font:600 13px "Microsoft YaHei","PingFang SC",sans-serif;fill:#475467}.edge{fill:none;stroke:#667085;stroke-width:2.2;marker-end:url(#arrow)}.caption{font:400 14px "Microsoft YaHei","PingFang SC",sans-serif;fill:#667085}
    </style>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <text class="title" x="48" y="55">工作台页面信息架构</text>
  <text class="subtitle" x="48" y="84">四个导航入口共享当前 Job 上下文，核心动作从控制台进入，历史和产物负责复盘</text>
  <rect class="panel" x="40" y="112" width="1520" height="730" rx="14"/>

  <rect class="root" x="620" y="160" width="280" height="82" rx="12"/><text class="roottext" x="760" y="194" text-anchor="middle">继任采集与投递工作台</text><text x="760" y="220" text-anchor="middle" fill="#d0d5dd" font-size="13" font-family="Microsoft YaHei">当前 Job 上下文</text>
  <rect class="nav" x="90" y="330" width="260" height="90" rx="10"/><text class="head" x="185" y="368">控制台</text><text class="sub" x="130" y="396">配置、连接、启动、实时进度</text>
  <rect class="nav" x="450" y="330" width="260" height="90" rx="10"/><text class="head" x="545" y="368">历史</text><text class="sub" x="500" y="396">任务状态、失败原因、续跑</text>
  <rect class="nav" x="810" y="330" width="260" height="90" rx="10"/><text class="head" x="905" y="368">产物</text><text class="sub" x="858" y="396">导出文件、报告、manifest</text>
  <rect class="nav" x="1170" y="330" width="260" height="90" rx="10"/><text class="head" x="1265" y="368">设置</text><text class="sub" x="1204" y="396">AI、Relay、SMTP、资料</text>
  <path class="edge" d="M700 242 C700 280 220 280 220 330"/><path class="edge" d="M740 242 C740 280 580 280 580 330"/><path class="edge" d="M780 242 C780 280 940 280 940 330"/><path class="edge" d="M820 242 C820 280 1300 280 1300 330"/>

  <rect class="detail" x="75" y="510" width="290" height="125" rx="10"/><text class="head" x="105" y="548">控制台核心区</text><text class="sub" x="105" y="577">Relay 状态 · 任务配置 · Agent 轨道</text><text class="sub" x="105" y="600">覆盖质量 · 日志 · 结果入口</text>
  <rect class="detail" x="425" y="510" width="290" height="125" rx="10"/><text class="head" x="455" y="548">历史核心区</text><text class="sub" x="455" y="577">Job 列表 · 状态筛选 · 错误查看</text><text class="sub" x="455" y="600">续跑入口 · 任务快照</text>
  <rect class="accent" x="775" y="510" width="290" height="125" rx="10"/><text class="head" x="805" y="548">产物核心区</text><text class="sub" x="805" y="577">JSON · CSV · XLSX · Markdown</text><text class="sub" x="805" y="600">manifest · SHA-256 · 下载</text>
  <rect class="detail" x="1125" y="510" width="350" height="125" rx="10"/><text class="head" x="1155" y="548">设置核心区</text><text class="sub" x="1155" y="577">AI Provider · 候选人资料 · Relay/CDP</text><text class="sub" x="1155" y="600">SMTP · 本地配置 · 脱敏状态</text>
  <path class="edge" d="M220 420 L220 510"/><path class="edge" d="M580 420 L580 510"/><path class="edge" d="M940 420 L940 510"/><path class="edge" d="M1300 420 L1300 510"/>

  <rect class="panel" x="75" y="690" width="1400" height="92" rx="10"/><text class="head" x="110" y="728">跨页面一致性</text><text class="caption" x="110" y="756">当前 Job、任务状态、草稿 dirty 状态和通知事件在四个入口间保持一致；页面刷新后优先恢复最新服务端快照。</text>
</svg>
