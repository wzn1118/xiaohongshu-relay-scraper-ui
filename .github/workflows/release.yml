name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  one-click-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install build prerequisites
        shell: pwsh
        run: |
          npm ci --no-audit --no-fund
          python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Build repository checkout
        run: npm run build
      - name: Install Chromium for the Windows open test
        run: npx playwright install chromium
      - name: Create sanitized one-click archives
        id: package
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'xiaohongshu-relay-scraper-ui-one-click-windows.zip'
          $codexArchive = Join-Path $env:RUNNER_TEMP 'xiaohongshu-relay-scraper-ui-one-click-codex-built-in-windows-x64.zip'
          ./scripts/package-github-release.ps1 -OutputPath $archive -SourceRef HEAD
          ./scripts/package-github-release-codex.ps1 -OutputPath $codexArchive -SourceRef HEAD
          "archive=$archive" >> $env:GITHUB_OUTPUT
          "checksum=$archive.sha256" >> $env:GITHUB_OUTPUT
          "codex_archive=$codexArchive" >> $env:GITHUB_OUTPUT
          "codex_checksum=$codexArchive.sha256" >> $env:GITHUB_OUTPUT
      - name: Verify clean archive installation and health
        shell: pwsh
        run: ./scripts/verify-github-release.ps1 -ArchivePath '${{ steps.package.outputs.archive }}' -Port 65431
      - name: Open the built-in Codex Windows archive
        shell: pwsh
        run: ./scripts/verify-github-release.ps1 -ArchivePath '${{ steps.package.outputs.codex_archive }}' -Port 65434 -LaunchEntry 'Start-Codex-App.cmd' -RequireCodexBuiltIn -ExpectedArchitecture x64 -BrowserSmoke -ScreenshotPath (Join-Path $env:RUNNER_TEMP 'xiaohongshu-relay-scraper-ui-codex-windows-x64-smoke.png') -EvidencePath (Join-Path $env:RUNNER_TEMP 'xiaohongshu-relay-scraper-ui-codex-windows-x64-evidence.json')
      - name: Upload verified one-click package
        uses: actions/upload-artifact@v4
        with:
          name: xiaohongshu-relay-scraper-ui-one-click-windows-${{ github.sha }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.checksum }}
            ${{ steps.package.outputs.codex_archive }}
            ${{ steps.package.outputs.codex_checksum }}
            ${{ runner.temp }}/xiaohongshu-relay-scraper-ui-codex-windows-x64-smoke.png
            ${{ runner.temp }}/xiaohongshu-relay-scraper-ui-codex-windows-x64-evidence.json
          if-no-files-found: error
          retention-days: 30

  one-click-macos:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install build prerequisites
        run: |
          npm ci --no-audit --no-fund
          python3 -m pip install --disable-pip-version-check -r requirements.txt
      - name: Build repository checkout
        run: npm run build
      - name: Install Chromium for the macOS open test
        run: npx playwright install chromium
      - name: Create sanitized macOS archives
        run: |
          archive="$RUNNER_TEMP/xiaohongshu-relay-scraper-ui-one-click-macos.zip"
          sh scripts/package-github-release-macos.sh --output-path "$archive" --source-ref HEAD
      - name: Open the clean archive through the macOS Finder launcher
        run: |
          sh scripts/verify-github-release-macos.sh \
            --archive-path "$RUNNER_TEMP/xiaohongshu-relay-scraper-ui-one-click-macos.zip" \
            --port 65432 \
            --browser-smoke \
            --screenshot-path "$RUNNER_TEMP/xiaohongshu-relay-scraper-ui-macos-open-smoke.png"
      - name: Upload verified macOS package
        uses: actions/upload-artifact@v4
        with:
          name: xiaohongshu-relay-scraper-ui-one-click-macos-${{ github.sha }}
          path: |
            ${{ runner.temp }}/xiaohongshu-relay-scraper-ui-one-click-macos.zip
            ${{ runner.temp }}/xiaohongshu-relay-scraper-ui-one-click-macos.zip.sha256
            ${{ runner.temp }}/xiaohongshu-relay-scraper-ui-macos-open-smoke.png
          if-no-files-found: error
          retention-days: 30

  codex-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: arm64
            runner: macos-15
            port: 65434
          - architecture: x64
            runner: macos-15-intel
            port: 65435
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install verification prerequisites
        run: |
          npm ci --no-audit --no-fund
          python3 -m pip install --disable-pip-version-check -r requirements.txt
          npx playwright install chromium
      - name: Assert the macOS runner architecture
        run: |
          expected='${{ matrix.architecture }}'
          actual=$(uname -m)
          [ "$actual" = "$expected" ] || { [ "$expected" = x64 ] && [ "$actual" = x86_64 ]; }
      - name: Package the native built-in Codex runtime
        run: |
          archive="$RUNNER_TEMP/xiaohongshu-relay-scraper-ui-one-click-codex-built-in-macos-${{ matrix.architecture }}.zip"
          sh scripts/package-github-release-macos-codex.sh \
            --output-path "$archive" \
            --archive-root "xiaohongshu-relay-scraper-ui-codex-built-in-macos-${{ matrix.architecture }}" \
            --architecture '${{ matrix.architecture }}' \
            --source-ref HEAD
      - name: Unpack, launch, and smoke the built-in Codex package
        run: |
          sh scripts/verify-github-release-macos.sh \
            --archive-path "$RUNNER_TEMP/xiaohongshu-relay-scraper-ui-one-click-codex-built-in-macos-${{ matrix.architecture }}.zip" \
            --port '${{ matrix.port }}' \
            --launch-entry Start-Codex-App.command \
            --require-codex-built-in \
            --expected-architecture '${{ matrix.architecture }}' \
            --browser-smoke \
            --screenshot-path "$RUNNER_TEMP/xiaohongshu-relay-scraper-ui-codex-macos-${{ matrix.architecture }}-smoke.png" \
            --evidence-path "$RUNNER_TEMP/xiaohongshu-relay-scraper-ui-codex-macos-${{ matrix.architecture }}-evidence.json"
      - name: Upload architecture-specific macOS package and evidence
        uses: actions/upload-artifact@v4
        with:
          name: xiaohongshu-relay-scraper-ui-one-click-codex-macos-${{ matrix.architecture }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/xiaohongshu-relay-scraper-ui-one-click-codex-built-in-macos-${{ matrix.architecture }}.zip
            ${{ runner.temp }}/xiaohongshu-relay-scraper-ui-one-click-codex-built-in-macos-${{ matrix.architecture }}.zip.sha256
            ${{ runner.temp }}/xiaohongshu-relay-scraper-ui-codex-macos-${{ matrix.architecture }}-smoke.png
            ${{ runner.temp }}/xiaohongshu-relay-scraper-ui-codex-macos-${{ matrix.architecture }}-evidence.json
          if-no-files-found: error
          retention-days: 30

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [one-click-windows, one-click-macos, codex-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download verified release assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: xiaohongshu-relay-scraper-ui-one-click-*
          merge-multiple: true
      - name: Publish tag as GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          assets=(release-assets/*.zip release-assets/*.zip.sha256)
          for asset in "${assets[@]}"; do
            test -f "$asset"
          done
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" "${assets[@]}" --verify-tag --generate-notes --title "$TAG"
          fi
