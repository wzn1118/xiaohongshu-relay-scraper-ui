name: Generate Linux Playwright baselines

on:
  push:
    branches:
      - codex/add-linux-playwright-baselines

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --update-snapshots
      - name: Commit Linux visual baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/audience-ai.spec.ts-snapshots/*-linux.png
          git add tests/e2e/expansion-workspace.spec.ts-snapshots/*-linux.png
          if git diff --cached --quiet; then
            echo "No new Linux baselines"
            exit 0
          fi
          git commit -m "test(e2e): add Linux visual baselines"
          git push
