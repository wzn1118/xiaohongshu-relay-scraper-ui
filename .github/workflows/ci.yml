name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: npm ci
      - run: python -m pip install -r requirements.txt
      - run: npm run check
      - run: npm run audit:dependencies
      - name: Install Chromium for the macOS package-open test
        if: matrix.os == 'macos-latest'
        run: npx playwright install chromium
      - name: Build and open the clean macOS release package
        if: matrix.os == 'macos-latest'
        run: |
          archive="$RUNNER_TEMP/xiaohongshu-relay-scraper-ui-one-click-macos.zip"
          sh scripts/package-github-release-macos.sh --output-path "$archive" --source-ref HEAD
          sh scripts/verify-github-release-macos.sh \
            --archive-path "$archive" \
            --port 65432 \
            --browser-smoke \
            --screenshot-path "$RUNNER_TEMP/xiaohongshu-relay-scraper-ui-macos-open-smoke.png"
      - name: Upload macOS package-open evidence
        if: matrix.os == 'macos-latest' && always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-package-open-evidence-${{ github.sha }}
          path: |
            ${{ runner.temp }}/xiaohongshu-relay-scraper-ui-one-click-macos.zip
            ${{ runner.temp }}/xiaohongshu-relay-scraper-ui-one-click-macos.zip.sha256
            ${{ runner.temp }}/xiaohongshu-relay-scraper-ui-macos-open-smoke.png
          if-no-files-found: warn
          retention-days: 7

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/playwright
          if-no-files-found: ignore
          retention-days: 7

  mailpit:
    runs-on: ubuntu-latest
    services:
      mailpit:
        image: axllent/mailpit:v1.30.6
        ports:
          - 1025:1025
          - 8025:8025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:mailpit
        env:
          MAILPIT_SMTP_PORT: 1025
          MAILPIT_HTTP_URL: http://127.0.0.1:8025
